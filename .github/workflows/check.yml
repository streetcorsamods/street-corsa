# Runs tools\check.ps1 (the solution, the installer's custom actions, the tests and the race mode harness) on every
# push to dev or main and every pull request to them. Windows: the game is WPF, and the AcTools DLLs it links are in
# lib\actools, so nothing else needs installing beyond the SDK global.json names and Python with lupa for the harness.
# On again since the repository moved to streetcorsamods and went public (2026-10-31; it was off from 2026-10-23 while
# private): tools\check.ps1 is still run by hand before a merge too. The actions are pinned to their commits (the
# release named beside each), and the token can only read.
name: check

permissions:
  contents: read

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Race mode harness requirements
        run: python -m pip install -r tools/sc_race_harness/requirements.txt

      - name: Check
        shell: pwsh
        run: ./tools/check.ps1

      - name: Test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            tests/**/TestResults/**
          if-no-files-found: ignore
