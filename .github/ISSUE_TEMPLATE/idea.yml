name: Idea
description: Something you'd like the game to have or do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you'd like, and what it would make better in your career.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: An example
      description: Optional. A moment in the game where it would come in, or another game that does it well.
