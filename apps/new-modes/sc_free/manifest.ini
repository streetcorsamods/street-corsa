; Street Corsa free run: the player alone on a track, as AC's practice session runs it. The mode only puts on the
; parts the car shows that its model does not have (car_parts.lua, copied in from sc_race when it is installed, with
; the parts' models); it starts nothing, judges nothing and never quits.
;
; No BASE_MODE: the race.ini Street Corsa writes decides the session. Street Corsa installs this folder into
; extension\lua\new-modes\sc_free before a free run of a car with such parts and selects it with
; [RACE] __CM_CUSTOM_MODE=sc_free; a free run of a car on its own parts runs without a mode, as before.

[ABOUT]
NAME = Street Corsa Free Run
AUTHOR = Street Corsa
VERSION = 1.0.0
DESCRIPTION = A Street Corsa free run: the car on its own parts, alone on the track, for as long as the player likes.

[TWEAKS]
HIDE_PITCREW=1
