; Street Corsa race: one street race against one rival or a field of them, run and scored for the Street Corsa career.
;
; No BASE_MODE: the race.ini Street Corsa writes decides the session, and a base mode would replace it. Every
; race, drag races too, is a race session (TYPE=3) of the laps its format gives AC, never AC's drag session
; (TYPE=7), whose rules teleport the cars. The format's own race is its module's, a format_<name>.lua next to
; mode.lua (race.ini [STREET_CORSA] MODULE); a mod's modules are put here too. Checked in the game on 2026-09-24: with this manifest the session stays as race.ini has
; it and physics.allowed() is true.
;
; Street Corsa installs this folder into extension\lua\new-modes\sc_race before every race and selects it
; with [RACE] __CM_CUSTOM_MODE=sc_race. Edit it in the repo (apps\new-modes\sc_race), not in the install:
; the next race puts the repo's copy back.

[ABOUT]
NAME = Street Corsa Race
AUTHOR = Street Corsa
; In step with SCRIPT_VERSION in mode.lua
VERSION = 4.4.0
DESCRIPTION = A Street Corsa street race: starts itself, judges crashes and false starts, reports to the career and quits.

[RULES]
; The physics API without the track opting in through its surfaces.ini: locking a crashed car's controls,
; holding a crashed AI, and (next) putting a car's damage back at the start
ALLOW_PHYSICS_ALTERATIONS=1
PENALTIES=0

[TWEAKS]
HIDE_PITCREW=1
DISABLE_FLAGS=YELLOW, BLUE
